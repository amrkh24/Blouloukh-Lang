<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي لغة البلولوخ لايف v0.7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 12px; }
        .code-input { background-color: #1a1a1a; color: #00ff66; font-family: monospace; font-size: 16px; border: 1px solid #555; width: 100%; padding: 10px; text-align: right; }
        .console-output { background-color: #000; color: #00ffbb; font-family: monospace; padding: 15px; border-radius: 5px; min-height: 150px; white-space: pre-wrap; text-align: right; direction: rtl; font-size: 16px; }
        .btn-blouloukh { background-color: #00ff66; color: #000; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center mb-4">
        <h2 style="color: #00ff66;">💻 Blouloukh Playground v0.7</h2>
        <p class="text-muted">نسخة التقفيل - مفيش أعطال تانية غصب عن المحرك!</p>
    </div>

    <div class="card shadow-lg">
        <div class="mb-3" style="text-align: right;">
            <label class="form-label fw-bold text-light fs-5">اكتب الكود هنا يا هندسة:</label>
            <textarea id="sourceCode" class="form-control code-input" rows="10" placeholder="اكتب كودك هنا..."></textarea>
        </div>
        <div class="mb-3">
            <button onclick="runBlouloukh()" class="btn btn-blouloukh w-100 py-3">اِقـرص واِعـمل دَوَر العَجَلة ⚡</button>
        </div>
        <div style="text-align: right;">
            <h5 class="text-light mb-2">الـ Console Output:</h5>
            <div id="consoleOutput" class="console-output">في انتظار دور العجلة...</div>
        </div>
    </div>
</div>

<script>
function runBlouloukh() {
    const codeInput = document.getElementById('sourceCode').value;
    const outputDiv = document.getElementById('consoleOutput');
    
    if (!codeInput.trim()) {
        outputDiv.innerHTML = "اكتب كود الأول يا أسطى! 🛑";
        return;
    }

    let outputLog = "";
    
    // تنظيف الكود وتجميع السطور المكسورة أوتوماتيكياً عشان الموبايل
    let cleanCode = codeInput
        .replace(/\n/g, ' @NEWLINE@ ')
        .replace(/\s+/g, ' ')
        .replace(/ثبت حضور/g, '\nثبت حضور')
        .replace(/جرّ لقمة/g, '\nجرّ لقمة')
        .replace(/اِقفل المحبس/g, '\nاِقفل المحبس')
        .replace(/سمعنا/g, '\nسمعنا')
        .replace(/اِنده على/g, 'اِنده على')
        .replace(/@NEWLINE@/g, ' ');

    const lines = cleanCode.split('\n');
    
    let globalVariables = {};
    let functions = {};
    let inFunctionMode = false;
    let currentFuncName = "";
    let currentFuncArgs = [];
    let currentFuncLines = [];

    try {
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;

            if (inFunctionMode) {
                if (line.includes("اِقفل المحبس")) {
                    functions[currentFuncName] = { args: currentFuncArgs, body: currentFuncLines };
                    outputLog += `[محبس]: تم تسجيل الدالة (${currentFuncName}) وقفل محبسها بنجاح. ✅\n`;
                    inFunctionMode = false;
                    continue;
                } else {
                    currentFuncLines.push(line);
                }
                continue;
            }

            if (line.startsWith("جرّ لقمة")) {
                let funcDef = line.replace("جرّ لقمة", "").trim();
                let openBrace = funcDef.indexOf("("); let closeBrace = funcDef.indexOf(")");
                if (openBrace === -1 || closeBrace === -1) {
                    throw new Error(`أقواس الدالة فيها مشكلة في السنتكس يا هندسة.`);
                }
                currentFuncName = funcDef.substring(0, openBrace).trim();
                let argsStr = funcDef.substring(openBrace + 1, closeBrace).trim();
                currentFuncArgs = argsStr ? argsStr.split(',').map(a => a.trim()) : [];
                inFunctionMode = true;
                continue;
            }

            outputLog = executeLine(line, globalVariables, functions, outputLog, i + 1);
        }

        outputLog += "\n🚀 تم التنفيذ وقعدنا في التكييف!";
        outputDiv.innerText = outputLog;

    } catch (err) {
        outputDiv.innerText = `🛑 عطل فني في السنتكس:\n${err.message}`;
    }
}

function evaluateMath(expr, vars) {
    let cleanExpr = expr.replace(/اِنده على.*/g, "").trim();
    let tokens = cleanExpr.split(/([+\-*/()])/).map(t => t.trim()).filter(t => t);
    let resolvedExpr = "";

    for (let token of tokens) {
        if (vars[token] !== undefined) {
            resolvedExpr += vars[token];
        } else {
            resolvedExpr += token;
        }
    }

    try {
        return eval(resolvedExpr);
    } catch (e) {
        return expr;
    }
}

function executeLine(line, vars, funcs, log, lineNum) {
    line = line.trim();
    if (line.startsWith("ثبت حضور")) {
        let definition = line.replace("ثبت حضور", "").trim();
        if (!definition.includes("=")) {
            throw new Error(`"ثبت حضور" ناقصة علامة (=)`);
        }
        let parts = definition.split("=");
        let varName = parts[0].trim();
        let varVal = parts[1].trim();

        if (varVal.includes("اِنده على")) {
            let callIndex = varVal.indexOf("اِنده على");
            let callStr = varVal.substring(callIndex);
            let res = handleFunctionCall(callStr, vars, funcs, lineNum);
            vars[varName] = res.value;
            log += res.log;
            log += `[ذاكرة]: تم حجز المتغير (${varName}) من ناتج الدالة بقيمة (${res.value})\n`;
        } 
        else if ((varVal.startsWith("'") && varVal.endsWith("'")) || (varVal.startsWith('"') && varVal.endsWith('"'))) {
            vars[varName] = varVal.substring(1, varVal.length - 1);
            log += `[ذاكرة]: تم حجز المتغير النصي (${varName})\n`;
        }
        else {
            vars[varName] = evaluateMath(varVal, vars);
            log += `[حساب]: تم معالجة العملية وتخزين (${varName}) بقيمة (${vars[varName]})\n`;
        }
    }
    else if (line.startsWith("سمعنا")) {
        let varName = line.replace("سمعنا", "").trim();
        if ((varName.startsWith("'") && varName.endsWith("'")) || (varName.startsWith('"') && varName.endsWith('"'))) {
            log += `> ${varName.substring(1, varName.length - 1)}\n`;
        }
        else if (vars[varName] !== undefined) {
            log += `> ${vars[varName]}\n`;
        } 
        else {
            log += `> ${evaluateMath(varName, vars)}\n`;
        }
    }
    return log;
}

function handleFunctionCall(callStr, currentVars, funcs, lineNum) {
    let callClean = callStr.replace("اِنده على", "").trim();
    let openBrace = callClean.indexOf("("); let closeBrace = callClean.indexOf(")");
    let funcName = callClean.substring(0, openBrace).trim();
    let passedArgsStr = callClean.substring(openBrace + 1, closeBrace).trim();
    let passedArgs = passedArgsStr ? passedArgsStr.split(',').map(a => a.trim()) : [];

    let targetFunc = funcs[funcName];
    if (!targetFunc) {
        throw new Error(`الدالة (${funcName}) مش مسجلة حضور!`);
    }

    let localVars = {};
    targetFunc.args.forEach((argName, index) => {
        let val = passedArgs[index];
        if (currentVars[val] !== undefined) {
            localVars[argName] = currentVars[val];
        } else {
            localVars[argName] = evaluateMath(val, currentVars);
        }
    });

    let funcLog = `[استدعاء]: جاري تشغيل الدالة (${funcName})...\n`;
    let returnValue = 0;

    for (let j = 0; j < targetFunc.body.length; j++) {
        let funcLine = targetFunc.body[j].trim();
        
        if (funcLine.startsWith("هات الباقي")) {
            let retVar = funcLine.replace("هat الباقي", "").replace("هات الباقي", "").trim();
            if (localVars[retVar] !== undefined) {
                returnValue = localVars[retVar];
            } else {
                returnValue = evaluateMath(retVar, localVars);
            }
            funcLog += `[راجع]: الدالة رجّعت قيمة الباقي (${returnValue})\n`;
            break; 
        }
        funcLog = executeLine(funcLine, localVars, funcs, funcLog, `داخلي`);
    }
    return { value: returnValue, log: funcLog };
}
</script>
</body>
</html>
