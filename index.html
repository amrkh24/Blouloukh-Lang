<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي لغة بلولوخ V0.8 - إصدار ليفل الوحش 🚌</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a;
            --panel-bg: #0d1117;
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --text-color: #e6edf3;
            --border-color: #30363d;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        .container { width: 95%; max-width: 1280px; display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }

        .panel { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 15px; padding: 20px; }

        textarea, .output-box {
            width: 100%; height: 400px; background: #010409; border: 1px solid var(--border-color);
            color: var(--neon-green); font-family: 'JetBrains Mono', monospace; font-size: 16px;
            padding: 15px; border-radius: 10px; resize: none;
        }

        .output-box { 
            color: var(--neon-blue); overflow-y: auto; 
            white-space: pre-wrap; /* دي هتخلي الكلام يلف بدل ما يطول */
            word-wrap: break-word; /* بتجبر الكلام يتقسم جوه البوكس */
            border-left: 4px solid var(--neon-blue);
            text-align: right;
        }

        .btn-run { background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink)); color: white; border: none; padding: 14px 60px; font-size: 1.4rem; font-weight: 900; border-radius: 50px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>🚌 محاكي لغة بلولوخ V0.8</h1>

    <div class="container">
        <div class="panel">
            <h3>📝 اكتب كود الموقف:</h3>
            <textarea id="editor" spellcheck="false">سجل عندك دالة حساب_الصافي(ايراد, بنزين)
    صافي = ايراد - بنزين
    هات الباقي صافي
خلص الكلام

ايرادي = 600
بند_البنزين = 150
النتيجة = حساب_الصافي(ايرادي, بند_البنزين)

سمعنا "صافي الوردية على وضعك يا زميلي:"
سمعنا النتيجة
الحصيلة اليومية</textarea>
        </div>

        <div class="panel">
            <h3>💻 الـ Console:</h3>
            <div id="output" class="output-box">مستني تدور المحرك يا هندسة...</div>
        </div>
    </div>

    <button class="btn-run" onclick="runBlouloukh()">شغّل المحرك 🔑</button>

    <script>

                    logBuffer += `📌 سجل عندك دالة -> تسجيل الدالة\n`;
                } else if (trimmed.startsWith('سمعنا')) {
