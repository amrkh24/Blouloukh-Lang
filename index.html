<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي لغة بلولوخ V0.8 - إصدار ليفل الوحش 🚌</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a;
            --panel-bg: #0d1117;
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --text-color: #e6edf3;
            --border-color: #30363d;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }

        /* تعديل الـ Container عشان يظبط على الموبايل */
        .container {
            width: 100%; max-width: 1200px;
            display: grid; 
            grid-template-columns: 1fr; /* موبايل: تحت بعض */
            gap: 15px;
        }
        @media (min-width: 850px) {
            .container { grid-template-columns: 1fr 1fr; } /* كمبيوتر: جنب بعض */
        }

        .panel { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 15px; padding: 15px; }

        textarea, .output-box {
            width: 100%; height: 300px; background: #010409;
            border: 1px solid var(--border-color); color: var(--neon-green);
            font-family: 'JetBrains Mono', monospace; font-size: 14px;
            padding: 15px; border-radius: 10px; resize: none;
        }

        /* الجزء اللي بيحل مشكلة الطول */
        .output-box { 
            color: var(--neon-blue); 
            overflow-y: auto;          /* يعمل سكرول لو الكلام زاد */
            max-height: 300px;         /* يثبت الارتفاع عشان ميمطش الجدول */
            white-space: pre-wrap;     /* يلف الكلام جوه الصندوق */
            word-wrap: break-word;     /* يكسر الكلمات الطويلة */
            border-left: 4px solid var(--neon-blue); 
        }

        .btn-run { background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink)); color: white; border: none; padding: 12px; width: 100%; font-weight: 900; border-radius: 30px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🚌 محاكي لغة بلولوخ V0.8</h1>
    
    <div class="container">
        <div class="panel">
            <h3>📝 اكتب الكود:</h3>
            <textarea id="editor" spellcheck="false">// اكتب كودك هنا...</textarea>
            <button class="btn-run" onclick="runBlouloukh()">شغّل المحرك 🔑</button>
        </div>

        <div class="panel">
            <h3>💻 المخرجات:</h3>
            <div id="output" class="output-box">مستني تدور المحرك يا هندسة...</div>
        </div>
    </div>

    <script>
        function runBlouloukh() {
            const code = document.getElementById('editor').value;
            const outputDiv = document.getElementById('output');
            const lines = code.split('\n');
            let logBuffer = "🤖 جاري المعالجة...\n\n";

            for (let index = 0; index < lines.length; index++) {
                let trimmed = lines[index].trim();
                if (!trimmed || trimmed.startsWith('//')) continue;
                
                if (trimmed.startsWith('سمعنا')) {
                    let msg = trimmed.replace('سمعنا', '').replace(/"/g, '').trim();
                    logBuffer += `📢 ${msg}\n`;
                } else {
                    logBuffer += `[سطر ${index+1}] تنفيذ: ${trimmed}\n`;
                }
            }
            outputDiv.innerText = logBuffer;
        }
    </script>
</body>
</html>
