<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي لغة البلولوخ V0.8</title>
    <style>
        body { background-color: #0d0d1a; color: #e6edf3; font-family: sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .panel { background: #16213e; padding: 20px; border-radius: 12px; border: 1px solid #ff4d6d; }
        
        textarea {
            width: 100%; height: 250px; background: #000; color: #00ff88;
            font-family: monospace; padding: 10px; border-radius: 5px; border: 1px solid #333;
        }

        /* الجزء اللي كان بيطول معاك، اتظبط هنا */
        .console-output { 
            background-color: #000; color: #00ffbb; font-family: monospace; 
            padding: 15px; border-radius: 5px; min-height: 150px; 
            width: 100%; height: 300px; /* تحديد طول ثابت */
            overflow-y: auto;          /* إضافة سكرول عمودي */
            word-wrap: break-word;     /* كسر الكلمات الطويلة */
            white-space: pre-wrap;     /* منع الخروج عن حدود الصندوق */
            text-align: right; direction: rtl; font-size: 14px;
        }

        .btn-run { 
            background: #ff4d6d; color: white; border: none; padding: 12px; 
            width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <h1>البلولوخ v0.8 🚀</h1>
        <textarea id="code" placeholder="اكتب كود البلولوخ v0.8 هنا..."></textarea>
        <button class="btn-run" onclick="runCode()">تشغيل v0.8</button>
        
        <h4 style="color: #ff4d6d; margin-top: 20px;">شاشة المخرجات:</h4>
        <div id="output" class="console-output"></div>
    </div>
</div>

<script>
function runCode() {
    const code = document.getElementById('code').value;
    const output = document.getElementById('output');
    output.innerText = "جاري تنفيذ الكود...\n--------------------------\n";

    // محاكاة التنفيذ (عدل المنطق هنا حسب احتياجك)
    try {
        // ضع هنا منطق الـ Parser الخاص بك
        output.innerText += "تمت المعالجة بنجاح.\n";
    } catch(e) {
        output.innerText += "خطأ: " + e.message;
    }
}
</script>

</body>
</html>
