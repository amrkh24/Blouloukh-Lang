            --neon-green: #39ff14;
            --border-color: #30363d;

        body { background-color: var(--bg-color); color: #e6edf3; font-family: sans-serif; padding: 15px; margin: 0; }

        .container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .panel { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 10px; padding: 15px; }

        }

            word-wrap: break-word; 
            text-align: right; 
            direction: rtl;
